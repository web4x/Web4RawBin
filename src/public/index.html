<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RawBin</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RawBin">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
  <style>
    :root { --rb-primary: #667eea; --rb-secondary: #764ba2; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, var(--rb-primary) 0%, var(--rb-secondary) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #333; }
    .container { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 90%; text-align: center; }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    .subtitle { font-size: 0.95rem; opacity: 0.6; margin-bottom: 24px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .links a { display: block; padding: 14px; background: var(--rb-primary); color: white; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 1rem; transition: transform 0.1s; }
    .links a:active { transform: scale(0.97); }
    .links a.secondary { background: transparent; color: var(--rb-primary); border: 2px solid rgba(102,126,234,0.3); }
    .ver { font-size: 0.7rem; opacity: 0.4; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>RawBin</h1>
    <p class="subtitle">AI Server Management Interface</p>
    <div class="links">
      <a href="/app">Open App</a>
      <a href="/profile" class="secondary">My Profile</a>
      <a href="/bug-report" class="secondary">Report a Bug</a>
      <a href="/md/README.md" class="secondary">Documentation</a>
      <button id="reset-pwa" style="width:100%;padding:14px;background:#e53935;color:white;border:none;border-radius:10px;font-weight:600;font-size:1rem;cursor:pointer;margin-top:4px">Reset PWA Cache</button>
    </div>
    <p class="ver" id="ver"></p>
  </div>
  <script>
    fetch('/api/config').then(r=>r.json()).then(c=>{document.getElementById('ver').textContent='v'+c.version+' · '+c.branch}).catch(()=>{});
    document.getElementById('reset-pwa').addEventListener('click', async () => {
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) await r.unregister();
        const keys = await caches.keys();
        for (const k of keys) await caches.delete(k);
        document.getElementById('reset-pwa').textContent = 'Cleared! Reloading...';
        setTimeout(() => location.reload(true), 500);
      } catch (e) { alert('Reset failed: ' + e.message); }
    });
  </script>
</body>
</html>
