ntity" data-qualified-name="GMN30" data-source-line="52" id="ent0031"><path d="M1362.28,449.8673 L1362.28,586.2618 L1639.2048,586.2618 L1639.2048,459.8673 L1629.2048,449.8673 L1362.28,449.8673" fill="#FFE0B2" style="stroke:#000000;stroke-width:1;"/><path d="M1629.2048,449.8673 L1629.2048,459.8673 L1639.2048,459.8673 L1629.2048,449.8673" fill="#FFE0B2" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="221.7109" x="1368.28" y="467.9371">ROOT-CAUSE (C) &#8212; CONFIRMED:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="255.9248" x="1368.28" y="483.7364">server.ts:25 PKG_VERSION read ONCE</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="240.4492" x="1368.28" y="499.5358">at startup (frozen const). /api/config</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="201.4683" x="1368.28" y="515.3351">+ /api/health return it forever.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="244.886" x="1368.28" y="531.1344">Restarts deferred thru v0.4.8/9/10 &#8658;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="222.7329" x="1368.28" y="546.9337">process froze at ~0.4.7 while disk</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="206.324" x="1368.28" y="562.733">serves 0.4.10 &#8658; device sees no</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="185.0911" x="1368.28" y="578.5323">mismatch &#8658; bar never fires.</text></g><g class="entity" data-qualified-name="GMN33" data-source-line="63" id="ent0034"><path d="M1044.45,473.5673 L1044.45,562.5639 A0,0 0 0 0 1044.45,562.5639 L1327.0369,562.5639 A0,0 0 0 0 1327.0369,562.5639 L1327.0369,483.5673 L1317.0369,473.5673