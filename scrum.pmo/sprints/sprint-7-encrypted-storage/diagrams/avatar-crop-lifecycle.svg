3066,752.8086,500.3066,756.8086,496.3066,752.8086" style="stroke:#667EEA;stroke-width:1;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.0933" x="496.3066" y="735.0664">_profile = msg.profile</text></g><g class="message" data-entity-1="part3" data-entity-2="part6" id="msg15"><polygon fill="#667EEA" points="1023.7617,793.4297,1033.7617,797.4297,1023.7617,801.4297,1027.7617,797.4297" style="stroke:#667EEA;stroke-width:1;"/><line style="stroke:#667EEA;stroke-width:1;" x1="489.3066" x2="1029.7617" y1="797.4297" y2="797.4297"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.7905" x="496.3066" y="777.377">window.dispatchEvent('rb-avatar-updated',</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.5156" x="504.5332" y="792.6875">{ token, url: profile.avatar, crop: profile.avatarCrop })</text></g><g class="message" data-entity-1="part6" data-entity-2="part6" id="msg16"><line style="stroke:#667EEA;stroke-width:1;" x1="1035.7617" x2="1077.7617" y1="830.8955" y2="830.8955"/><line style="stroke:#667EEA;stroke-width:1;" x1="1077.7617" x2="1077.7617" y1="830.8955" y2="843.8955"/><line style="stroke:#667EEA;stroke-width:1;" x1="1036.7617" x2="1077.7617" y1="843.8955" y2="843.8955"/><polygon fill="#667EEA" points="1046.7617,839.8955,1036.7617,843.8955,1046.7617,847.8955,1042.7617,843.8955" style="stroke:#667EEA;stroke-width:1;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.7788" x="1042.7617" y="826.1533">setAttribute('src', url + '?t=...')</text></g><path d="M1244.7788,810.4297 L1244.7788,850.4297 L1392.7788,850.4297 L1392.7788,820.4297 L1382.7788,810.4297 L1244.7788,810.4297" fill="#E74C3C" style="stroke:#181818;stroke-width:0.5;"/><path d="M1382.7788,810.4297 L1382.7788,820.4297 L1392.7788,820.4297 L1382.7788,810.4297" fill="#E74C3C" style="stroke:#181818;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="84.4873" x="1250.7788" y="827.998">CACHE BUST</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38.6128" x="1339.3794" y="827.998">forces</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.7803" x="1250.7788" y="843.3086">img reload</text><g class="message" data-entity-1="part6" data-entity-2="part6" id="msg18"><line style="stroke:#667EEA;stroke-width:1;" x1="1035.7617" x2="1077.7617" y1="877.3613" y2="877.3613"/><line style="stroke:#667EEA;stroke-width:1;" x1="1077.7617" x2="1077.7617" y1="877.3613" y2="890.3613"/><line style="stroke:#667EEA;stroke-width:1;" x1="1036.7617" x2="1077.7617" y1="890.3613" y2="890.3613"/><polygon fill="#667EEA" points="1046.7617,886.3613,1036.7617,890.3613,1046.7617,894.3613,1042.7617,890.3613" style="stroke:#667EEA;stroke-width:1;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.1709" x="1042.7617" y="872.6191">setAttribute('crop', JSON.stringify(crop))</text></g><g class="message" data-entity-1="part6" data-entity-2="part6" id="msg19"><line style="stroke:#667EEA;stroke-width:1;" x1="1035.7617" x2="1077.7617" y1="919.6719" y2="919.6719"/><line style="stroke:#667EEA;stroke-width:1;" x1="1077.7617" x2="1077.7617" y1="919.6719" y2="932.6719"/><line style="stroke:#667EEA;stroke-width:1;" x1="1036.7617" x2="1077.7617" y1="932.6719" y2="932.6719"/><polygon fill="#667EEA" points="1046.7617,928.6719,1036.7617,932.6719,1046.7617,936.6719,1042.7617,932.6719" style="stroke:#667EEA;stroke-width:1;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.8291" x="1042.7617" y="914.9297">render()</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1403.7539" x="0" y="961.3271"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1403.7539" y1="961.3271" y2="961.3271"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1403.7539" y1="964.3271" y2="964.3271"/><rect fill="#EEEEEE" height="23.3105" style="stroke:#000000;stroke-width:2;" width="286.6636" x="558.5452" y="950.6719"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="268.3789" x="564.5452" y="967.2402">BUG 1: Crop Transform Displaces Image</text><path d="M804,988.9824 L804,1197.9824 L1266,1197.9824 L1266,998.9824 L1256,988.9824 L804,988.9824" fill="#E74C3C" style="stroke:#181818;stroke-width:0.5;"/><path d="M1256,988.9824 L1256,998.9824 L1266,998.9824 L1256,988.9824" fill="#E74C3C" style="stroke:#181818;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="242.2202" x="810" y="1006.5508">ROOT CAUSE 1: Visual displacement</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.8491" x="810" y="1021.8613">render() applies: transform:scale(S) translate(Xpx, Ypx)</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="406.7197" x="810" y="1037.1719">on the &lt;img&gt; INSIDE a small circular overflow:hidden container.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="810" y="1052.4824">&#160;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.9468" x="810" y="1067.793">The overlay image is ~90vw wide. The circular avatar is 24-80px.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.249" x="810" y="1083.1035">translate(X,Y) values from the large overlay are HUGE relative</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.9268" x="810" y="1098.4141">to the tiny circular container.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="810" y="1113.7246">&#160;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.2266" x="810" y="1129.0352">Example: overlay image 300px wide, user pans 50px right.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.5771" x="810" y="1144.3457">tx=50. In a 24px badge, translate(50px,0) pushes the</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="441.6318" x="810" y="1159.6563">image completely out of the circle &#8594; shows background &#8594; R fallback.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="810" y="1174.9668">&#160;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="408.6431" x="810" y="1190.2773">FIX: Scale tx/ty relative to container size, not absolute pixels.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1403.7539" x="0" y="1223.6748"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1403.7539" y1="1223.6748" y2="1223.6748"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1403.7539" y1="1226.6748" y2="1226.6748"/><rect fill="#EEEEEE" height="23.3105" style="stroke:#000000;stroke-width:2;" width="189.9634" x="606.8953" y="1213.0195"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="171.6787" x="612.8953" y="1229.5879">BUG 2: Crop Not Restored</text><path d="M838,1251.3301 L838,1414.3301 L1232,1414.3301 L1232,1261.3301 L1222,1251.3301 L838,1251.3301" fill="#E74C3C" style="stroke:#181818;stroke-width:0.5;"/><path d="M1222,1251.3301 L1222,1261.3301 L1232,1261.3301 L1222,1251.3301" fill="#E74C3C" style="stroke:#181818;stroke-width:0.5;"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="256.3628" x="844" y="1268.8984">ROOT CAUSE 2: Missing crop attribute</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.0137" x="844" y="1284.209">rb-member-badge creates &lt;rb-avatar&gt; with src and name</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.8491" x="844" y="1299.5195">but does NOT pass crop attribute.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.3628" x="844" y="1314.8301">Neither does RoomBrowser lobby avatar.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.0669" x="844" y="1330.1406">ProfileEditor does not pass crop either.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="844" y="1345.4512">&#160;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.9131" x="844" y="1360.7617">crop data exists in profile but is never propagated</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.9888" x="844" y="1376.0723">to the initial rb-avatar attribute at creation time.</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="844" y="1391.3828">&#160;</text><text fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="363.124" x="844" y="1406.6934">FIX: Pass crop from profile/member data to rb-avatar.</text><?plantuml-src fLRRRjj647tdLmoS1rrgqR9p5w8KbYmd2XBBaAmYAGmOAt8aBKBkChjBIshWea_zWA9Vs2_fx2vreUmcBVeWG5pEpfmvSsQ6Xfi4uVIM6QQWgsG6x_aKerL4ft_zzYSCfJJGPRac8y6IbUOwq9-vo9XYAKnOz7ccP2xYhaoaWaV7x9YTu8v5Z