na" font-size="14" lengthAdjust="spacing" textLength="31.8555" x="1216.08" y="184.8825">User</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="69.8496" x="1216.08" y="201.8971">(Browser)</text></g><!--entity Server--><g class="entity" data-qualified-name="Server" data-source-line="13" id="ent0003"><ellipse cx="2230.0031" cy="125.8073" fill="#FFFFFF" rx="16" ry="16" style="stroke:#000000;stroke-width:1;"/><path d="M2230.0031,145.8073 C2234.0031,145.8073 2237.0031,145.8073 2241.0031,141.8073 C2249.0031,141.8073 2257.0031,149.8073 2257.0031,157.8073 L2257.0031,161.8073 C2257.0031,165.8073 2253.0031,169.8073 2249.0031,169.8073 L2211.0031,169.8073 C2207.0031,169.8073 2203.0031,165.8073 2203.0031,161.8073 L2203.0031,157.8073 C2203.0031,149.8073 2211.0031,141.8073 2219.0031,141.8073 C2223.0031,145.8073 2226.0031,145.8073 2230.0031,145.8073" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="46.4844" x="2192.59" y="184.8825">Server</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="74.8262" x="2192.59" y="201.8971">(server.ts)</text></g><!--entity SW--><g class="entity" data-qualified-name="SW" data-source-line="14" id="ent0004"><ellipse cx="930" cy="125.8073" fill="#FFFFFF" rx="16" ry="16" style="stroke:#000000;stroke-width:1;"/><path d="M930,145.8073 C934,145.8073 937,145.8073 941,141.8073 C949,141.8073 957,149.8073 957,157.8073 L957,161.8073 C957,165.8073 953,169.8073 949,169.8073 L911,169.8073 C907,169.8073 903,165.8073 903,161.8073 L903,157.8073 C903,149.8073 911,141.8073 919,141.8073 C923,145.8073 926,145.8073 930,145.8073" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="23.4131" x="905.6641" y="184.8825">SW</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="48.6719" x="905.6641" y="201.8971">(sw.js)</text></g><!--entity Disk--><g class="entity" data-qualified-name="Disk" data-source-line="15" id="ent0005"><path d="M3238.88,135.3073 C3238.88,125.3073 3296.0035,125.3073 3296.0035,125.3073 C3296.0035,125.3073 3353.1271,125.3073 3353.1271,135.3073 L3353.1271,178.3366 C3353.1271,188.3366 3296.0035,188.3366 3296.0035,188.3366 C3296.0035,188.3366 3238.88,188.3366 3238.88,178.3366 L3238.88,135.3073" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M3238.88,135.3073 C3238.88,145.3073 3296.0035,145.3073 3296.0035,145.3073 C3296.0035,145.3073 3353.1271,145.3073 3353.1271,135.3073" fill="none" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="30.208" x="3248.88" y="163.3825">Disk</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="94.2471" x="3248.88" y="180.3971">(data/users/)</text></g><g class="entity" data-qualified-name="GMN54" data-source-line="104" id="ent0055"><path d="M2645.86,675.9073 L2645.86,827.0073 L2610.76,831.0073 L2645.86,835.0073 L2645.86,986.0943 A0,0 0 0 0 2645.86,986.0943 L3150.1388,986.0943 A0,0 0 0 0 3150.1388,986.0943 L3150.1388,685.9073 L3140.1388,675.9073 L2645.86,675.9073 A0,0 0 0 0 2645.86,675.9073" fill="#FFCCCC" style="stroke:#000000;stroke-width:1;"/><path d="M3140.1388,675.9073 L3140.1388,685.9073 L3150.1388,685.9073 L3140.1388,675.9073" fill="#FFCCCC" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="304.0972" x="2651.86" y="693.9771">ROOT CAUSE: avatar.refreshAll is missing</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.5703" x="2651.86" y="709.7764">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="271.8511" x="2651.86" y="725.5758">After upload succeeds, rb-avatar.ts does:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="379.6353" x="2651.86" y="741.3751">1. Sets its OWN src to avatarUrl + "?t=" + Date.now() &#9989;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="289.8604" x="2651.86" y="757.1744">2. Dispatches "rb-avatar-changed" event &#9989;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="299.585" x="2651.86" y="772.9737">3. ProfileEditor captures event, stores URL &#9989;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.5703" x="2651.86" y="788.773">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="358.0649" x="2651.86" y="804.5723">BUT: other rb-avatar instances are NOT updated:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="370.6206" x="2651.86" y="820.3717">- RoomBrowser lobby avatar: STALE (still shows old src)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="483.2788" x="2651.86" y="836.171">- rb-member-badge in room: STALE (avatarUrl from Room member data)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="447.8652" x="2651.86" y="851.9703">- Profile page: STALE (reloads from profile.avatar which IS updated,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="182.2666" x="2661.0006" y="867.7696">but page doesn't re-render)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="349.2607" x="2651.86" y="883.5689">- Other members' screens: STALE (server broadcasts</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="241.2871" x="2661.0006" y="899.3682">MEMBER_JOINED with old avatarUrl)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.5703" x="2651.86" y="915.1676">&#160;</text><rect fill="#000000" height="3.5" width="3.5" x="2660.86" y="923.6964"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="382.2114" x="2667.86" y="930.9669">The uploading rb-avatar updates itself via ?t= cache-bust,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="293.3696" x="2651.86" y="946.7662">but no mechanism propagates the change to</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="304.7954" x="2651.86" y="962.5655">other rb-avatar elements on the same page or</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="222.2441" x="2651.86" y="978.3648">other clients in the same room.**</text></g><g class="entity" data-qualified-name="GMN57" data-source-line="126" id="ent0058"><path d="M3379.19,486.4173 L3379.19,607.0125 A0,0 0 0 0 3379.19,607.0125 L3768.8111,607.0125 A0,0 0 0 0 3768.8111,607.0125 L3768.8111,496.4173 L3758.8111,486.4173 L3587.22,486.4173 L3594.05,415.7473 L3579.22,486.4173 L3379.19,486.4173 A0,0 0 0 0 3379.19,486.4173" fill="#FFFFCC" style="stroke:#000000;stroke-width:1;"/><path d="M3758.8111,486.4173 L3758.8111,496.4173 L3768.8111,496.4173 L3758.8111,486.4173" fill="#FFFFCC" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="135.5923" x="3385.19" y="504.4871">RACE CONDITION:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="244.3975" x="3385.19" y="520.2864">fetchUniqueAvatar() is async (.then).</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="368.6211" x="3385.19" y="536.0858">PROFILE_UPDATED is sent BEFORE the fetch completes.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="323.0767" x="3385.19" y="551.8851">Client receives profile.avatar = '' on first commit.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="346.8931" x="3385.19" y="567.6844">Avatar URL is set LATER in a separate saveProfiles().</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="309.9243" x="3385.19" y="583.4837">Client never receives the updated URL unless it</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="166.1563" x="3385.19" y="599.283">re-identifies or refreshes.</text></g><g class="entity" data-qualified-name="GMN60" data-source-line="136" id="ent0061"><path d="M530.83,478.5173 L530.83,614.9118 A0,0 0 0 0 530.83,614.9118 L797.1606,614.9118 A0,0 0 0 0 797.1606,614.9118 L797.1606,488.5173 L787.1606,478.5173 L668,478.5173 L664,411.2773 L660,478.5173 L530.83,478.5173 A0,0 0 0 0 530.83,478.5173" fill="#FFFFCC" style="stroke:#000000;stroke-width:1;"/><path d="M787.1606,478.5173 L787.1606,488.5173 L797.1606,488.5173 L787.1606,478.5173" fill="#FFFFCC" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="35.3945" x="536.83" y="496.5871">GAP:</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="104.0698" x="576.7948" y="496.5871">After crop save,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="187.1035" x="536.83" y="512.3864">only the uploading rb-avatar</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="201.7729" x="536.83" y="528.1858">updates its own crop attribute.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="191.2422" x="536.83" y="543.9851">Other instances don't receive</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="136.2651" x="536.83" y="559.7844">the new crop values.</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="245.3306" x="536.83" y="575.5837">Needs: PROFILE_UPDATED broadcast</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="187.9541" x="536.83" y="591.383">with avatarCrop &#8594; all clients</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="218.3403" x="536.83" y="607.1823">update their rb-avatar crop attrs.</text></g><g class="entity" data-qualified-name="GMN63" data-source-line="147" id="ent0064"><path d="M4595.34,325.1773 L4595.34,414.1739 L4858.6564,414.1739 L4858.6564,335.1773 L4848.6564,325.1773 L4595.34,325.1773" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M4848.6564,325.1773 L4848.6564,335.1773 L4858.6564,335.1773 L4848.6564,325.1773" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="55.8276" x="4601.34" y="343.2471">SW uses</text><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="93.6533" x="4661.7379" y="343.2471">networkFirst</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="83.6948" x="4759.9616" y="343.2471">for /api/* &#9989;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="205.5889" x="4601.34" y="359.0464">ETag changes on re-encrypt &#9989;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="205.7847" x="4601.34" y="374.8458">No SW caching bug &#8212; the stale</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="72.8965" x="4601.34" y="390.6451">display is a</text><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="116.1304" x="4678.8068" y="390.6451">client rendering</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="160.2783" x="4601.34" y="406.4444">issue, not a cache issue.</text></g><!--link UC_UPLOAD to UC_ENCRYPT--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" data-source-line="27" id="lnk12"><path d="M2055.67,369.6773 C2087.44,369.6773 2116.94,369.6773 2147.58,369.6773" fill="none" id="UC_UPLOAD-to-UC_ENCRYPT" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="2153.58,369.6773,2144.58,365.6773,2148.58,369.6773,2144.58,373.6773,2153.58,369.6773" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="62.9624" x="2073.6" y="363.7471">&#171;include&#187;</text></g><!--link UC_ENCRYPT to UC_UPDATE_URL--><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" data-link-type="dependency" data-source-line="28" id="lnk13"><path d="M2306.33,369.6773 C2336.47,369.6773 2365.58,369.6773 2397.98,369.6773" fill="none" id="UC_ENCRYPT-to-UC_UPDATE_URL" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="2403.98,369.6773,2394.98,365.6773,2398.98,369.6773,2394.98,373.6773,2403.98,369.6773" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="62.9624" x="2324.21" y="363.7471">&#171;include&#187;</text></g><!--link UC_UPDATE_URL to UC_CACHE_INV--><g class="link" data-entity-1="ent0009" data-entity-2="ent0010" data-link-type="dependency" data-source-line="29" id="lnk14"><path d="M2478.2,412.9573 C2465.08,432.4573 2449.97,456.1873 2438,478.5173 C2380.37,5