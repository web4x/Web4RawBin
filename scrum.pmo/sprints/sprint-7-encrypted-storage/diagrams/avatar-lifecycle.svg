;&#160;</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="4.9219" x="4642.9836" y="1052.1988">&#160;</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="4.9219" x="4673.964" y="1052.1988">&#160;</text><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="33.3867" x="4678.8859" y="1052.1988">BUG</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="92.5244" x="4717.1945" y="1052.1988">&#8212; root cause</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="4.9219" x="4623.2961" y="1069.2135">&#160;</text><text fill="#000000" filter="url(#b66guyhrwnf5n2)" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="14.7656" x="4628.2179" y="1069.2135">&#160;&#160;&#160;</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="4.9219" x="4642.9836" y="1069.2135">&#160;</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="157.8486" x="4678.8859" y="1069.2135">Gap (secondary issue)</text><line style="stroke:#000000;stroke-width:1;" x1="4623.2961" x2="4841.6564" y1="1004.0943" y2="1004.0943"/><line style="stroke:#000000;stroke-width:1;" x1="4623.2961" x2="4841.6564" y1="1021.109" y2="1021.109"/><line style="stroke:#000000;stroke-width:1;" x1="4623.2961" x2="4841.6564" y1="1038.1236" y2="1038.1236"/><line style="stroke:#000000;stroke-width:1;" x1="4623.2961" x2="4841.6564" y1="1055.1383" y2="1055.1383"/><line style="stroke:#000000;stroke-width:1;" x1="4623.2961" x2="4841.6564" y1="1072.1529" y2="1072.1529"/><line style="stroke:#000000;stroke-width:1;" x1="4623.2961" x2="4623.2961" y1="1004.0943" y2="1072.1529"/><line style="stroke:#000000;stroke-width:1;" x1="4673.964" x2="4673.964" y1="1004.0943" y2="1072.1529"/><line style="stroke:#000000;stroke-width:1;" x1="4841.6564" x2="4841.6564" y1="1004.0943" y2="1072.1529"/></g><g class="footer" data-source-line="161"><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="3.5156" x="2426.5704" y="1100.2066">&#160;</text><text fill="#000000" font-family="Verdana" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="44.1211" x="2266.4923" y="1112.3599">Verdict:</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="276.0352" x="2314.129" y="1112.3599">The uploaded photo IS encrypted and stored correctly.</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="270.1318" x="2293.2623" y="1124.5133">The /api/avatar endpoint DOES serve the new image.</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="75.9521" x="2224.8687" y="1136.6666">The bug is that</text><text fill="#000000" font-family="Verdana" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="327.4512" x="2304.3365" y="1136.6666">other rb-avatar instances on the page are not re-rendered</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="106.2695" x="2241.3018" y="1148.8199">after upload, and the</text><text fill="#000000" font-family="Verdana" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="162.373" x="2351.087" y="1148.8199">default avatar race condition</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="98.3789" x="2516.9757" y="1148.8199">means first-commit</text><text fill="#000000" font-family="Verdana" font-size="10" lengthAdjust="spacing" textLength="230.7617" x="2312.9473" y="1160.9732">users don't see their avatar until page reload.</text></g><?plantuml-src dLZTRXkx4RxNKqpTYzXA9FVafnU6us8jhHorikHASem01W9gbv9ulEAgIygkUqw0thGFKFIoJvSdwJSajLhPicCS0q5iScOuFz_yxU_iN2uaBJEXTCtSABqK