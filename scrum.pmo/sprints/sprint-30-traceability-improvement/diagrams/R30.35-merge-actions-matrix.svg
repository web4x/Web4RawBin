<text x="22" y="824" font-size="14" font-weight="700" fill="#7d6608">ROOT: v0.7.51 uses a SINGLE-PICK center (Conflict.pick:'a'|'b'; rebuildCenter emits ONE side). Tron's model = COMPOSABLE BOTH-VERSIONS center.</text>
<text x="22" y="844" font-size="11.5" fill="#5b4409">REWORK (3 changes, FOR TRON REVIEW — build nothing): (1) CENTER holds BOTH versions per changed region — older=DARK, newer=HIGHLIGHTED (line-38 shows mcdonges.latest AND dev).</text>
<text x="22" y="864" font-size="11.5" fill="#5b4409">(2) ≫ = ADD-left / ≪ = ADD-right into center (idempotent, COEXIST — click both → both present); NOT replace/pick. (3) ✕ = REMOVE the line from center ALWAYS (drop an unwanted version); NOT dismiss-overlay.</text>
<text x="22" y="884" font-size="11.5" fill="#5b4409">DATA MODEL: replace Conflict.pick:&#x27;a&#x27;|&#x27;b&#x27; with an included-line SET per region (left ∪ right − removed); rebuildCenter emits the set styled by age; acceptChange→addSide(id,side); NEW removeLine(id,lineRef).</text>
<text x="22" y="904" font-size="11.5" fill="#5b4409">VERDICT: nearly all cells BROKEN vs the new model — it is a MODEL replacement, not per-cell tweaks. Same 16 UC uuids (dual-links intact); req reworks each UC.expectedBehaviour to add/remove semantics.</text>
