<text x="22" y="829" font-size="11.5" fill="#5b4409">RC2 — ≫/≪ are INERT when the default pick already = that side (default pick = the change&#x27;s ORIGIN side): add≫(local), modify≫(local), conflict≫, empty-side edges = NO-OP.</text>
<text x="22" y="848" font-size="11.5" fill="#5b4409">TALLY: WORKS 6 (delete≫, delete≪, add≪, modify≪, conflict≪, re-add-after-delete) · BROKEN 5 (4× dismiss + already-applied) · INERT 5 (add≫, modify≫, conflict≫, L-empty, R-empty).</text>
<text x="22" y="867" font-size="11.5" fill="#5b4409">FIX DIRECTION (post-approval, NOT yet): RC1 → ✕ must rebuildCenter (revert region / drop change). RC2 → ≫/≪ origin-aware so the button is never a no-op.</text>
